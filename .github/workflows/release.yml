# Builds, tests, signs and publishes a release. The app checks the latest release's update.json and
# installs newer versions by itself (Updater.kt).
#
# To release: bump versionCode/versionName in app/build.gradle.kts, commit, then
#   git tag v1.4.0 && git push origin v1.4.0
#
# One-time setup (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of the signing keystore (must be the key the installed app was signed with)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# The repo (or at least its releases) must be public so phones can download without logging in.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          gradle --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish release with update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read CODE NAME < <(gradle --no-daemon -q :app:printVersion | tail -1)
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$NAME"
          cp app/build/outputs/apk/release/app-release.apk medreminder.apk
          SHA=$(sha256sum medreminder.apk | cut -d' ' -f1)
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/medreminder.apk"
          NOTES=$(git log -1 --pretty=%s)
          jq -n --argjson code "$CODE" --arg name "$NAME" --arg apk "$APK_URL" --arg sha "$SHA" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, apk: $apk, sha256: $sha, notes: $notes}' > update.json
          cat update.json
          gh release create "$TAG" medreminder.apk update.json --title "Med Reminder $NAME" --notes "$NOTES" --latest
